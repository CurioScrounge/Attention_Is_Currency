<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attention is Currency — Neural Settings Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(14, 33, 49, 0.637);
      --card-border: #1e293b;
      --cyan: #7ad2f5;
      --magenta: #ff0055;
      --text: #f8fafc;
      --text-muted: #759ace;
      --input-bg: #070d19;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rajdhani', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 32px 16px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      min-height: 100vh;
    }

    .container { max-width: 850px; margin: 0 auto; }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--cyan);
      padding-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      box-shadow: 0 4px 20px -5px rgba(0, 243, 255, 0.2);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
    }

    p.subtitle {
      font-family: 'Orbitron', monospace;
      color: var(--cyan);
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-top: 5px;
      text-transform: uppercase;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 2px;
      border: 1px solid transparent;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: rgba(0, 242, 255, 0.116);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    .btn-primary:hover {
      background: var(--cyan);
      color: #030712;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
    }

    .btn-danger {
      background: rgba(255, 0, 85, 0.1);
      border-color: var(--magenta);
      color: var(--magenta);
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
    }
    .btn-danger:hover {
      background: var(--magenta);
      color: white;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.4);
      border-color: #475569;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: #334155; color: white; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 4px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #fff457;
      text-transform: uppercase;
    }

    textarea {
      width:100%;
      font-size: 1rem;
    }

    input[type="text"], input[type="number"], input[type="url"] {
      width: 100%;
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1px solid #1e293b;
      border-radius: 2px;
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .domain-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .pill {
      background: rgba(21, 62, 65, 0.692);
      border: 1px solid rgba(75, 214, 221, 0.397);
      padding: 6px 12px;
      border-radius: 2px;
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      color: rgba(170, 239, 243, 0.973);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-remove {
      cursor: pointer;
      color: var(--magenta);
      font-weight: bold;
    }

    .pill-remove:hover { color: #ffffff; }

    .domain-input-group { display: flex; gap: 8px; }
    .domain-input-group input { flex: 1; }

    .status-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #030712;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 12px 24px;
      border-radius: 2px;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>System Terminal</h1>
        <p class="subtitle">// Setting Parameters</p>
      </div>
      <button id="reset-btn" class="btn btn-secondary">Reset Stack Defaults</button>
    </header>

    <div id="categories-container"></div>

    <div class="card">
      <h2 class="card-title" style="margin-bottom: 16px;">Initialize New Category</h2>
      <form id="add-category-form">
        <div class="form-group">
          <label for="new-cat-name">Category Designation</label>
          <input type="text" id="new-cat-name" placeholder="e.g. Social Media" required>
        </div>
        <div class="form-group">
          <label for="new-cat-domains">Target Domains (comma separated)</label>
          <input type="text" id="new-cat-domains" placeholder="x.com, reddit.com" required>
        </div>
        <div class="form-group">
          <label for="new-cat-redirect">Reroute Target URL</label>
          <input type="url" id="new-cat-redirect" placeholder="https://www.google.com" required>
        </div>
        <div class="form-group">
          <label for="new-cat-icon">HUD Avatar / Emblem URL (Optional Image/Icon URL)</label>
          <input type="url" id="new-cat-icon" placeholder="https://example.com/avatar.png">
        </div>
        <div class="form-group">
          <label for="new-cat-timer">Leisure Window Limit (Minutes)</label>
          <input type="number" id="new-cat-timer" value="25" min="1" max="240" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Protocol</button>
      </form>
    </div>
     <div class="card">
  <div class="card-header" style="margin-bottom: 16px;">
    <span class="card-title">Leisure Session Directive / Mindfulness Note</span>
  </div>
  <div class="form-group">
    <label>Custom Note (Displays when selecting Leisure mode)</label>
    <textarea id="unproductive-note" rows="3" placeholder="Enter custom note..."></textarea>
  </div>
  <button type="button" id="save-note-btn" class="btn btn-primary">Save Note</button>
</div>
  </div>

 

  <div id="status-toast" class="status-toast">SYSTEM UPDATED</div>
  <script src="options.js"></script>
</body>
</html>
